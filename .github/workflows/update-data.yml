name: Güncel Veri Topla

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-news-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade -r requirements.txt

      - name: Kaynakları tara ve aday kayıtları üret
        run: python update_script.py

      - name: Çıktıları doğrula
        run: |
          python -m json.tool data/duyurular.json >/dev/null
          python -m json.tool data/audit.json >/dev/null
          test -s rss.xml

      - name: Verileri ve denetim izini yayımla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/duyurular.json data/audit.json data/archive rss.xml
          git diff --cached --quiet || git commit -m "Kaynak adaylarını ve denetim izini güncelle"
          git push
