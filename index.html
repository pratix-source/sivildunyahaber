<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sivil Dünya Haberler | haber.sivildunya.com</title><meta name="description" content="Gündem, personel alımı, akademik personel, sınav, tayin, kamu personeli, eğitim-burs, sivil toplum ve destekler için güncel duyuru dashboardu."><link rel="canonical" href="https://haber.sivildunya.com/"><link rel="alternate" type="application/rss+xml" title="Sivil Dünya Haberler RSS" href="https://haber.sivildunya.com/rss.xml"><meta property="og:title" content="Sivil Dünya Haberler"><meta property="og:description" content="Kamu, akademi ve sivil toplum duyuruları."><meta property="og:url" content="https://haber.sivildunya.com/"><meta property="og:type" content="website"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#243fb5"><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}.ticker{animation:ticker 28s linear infinite}@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}.ad{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 10px,#f1f5f9 10px,#f1f5f9 20px)}.dark body{background:#0f172a;color:#e2e8f0}</style></head><body class="bg-white text-slate-900"><header class="border-b border-slate-200 bg-white sticky top-0 z-50"><div class="max-w-6xl mx-auto px-4"><div class="flex items-center justify-between h-16"><a class="flex items-center gap-2" href="/"><span class="text-3xl md:text-4xl font-black tracking-tight">Sivil Dünya Haberler</span><span class="bg-blue-700 text-white rounded-full w-8 h-8 grid place-items-center text-sm">▣</span></a><div class="flex gap-3"><button id="themeBtn" class="text-xl">◐</button><button id="installBtn" class="hidden bg-blue-700 text-white px-3 py-2 rounded-xl text-sm font-bold">📱 Ekle</button><button id="searchToggle" class="text-2xl">⌕</button></div></div><nav id="nav" class="flex gap-7 overflow-x-auto whitespace-nowrap h-12 items-center text-sm font-extrabold"><button data-cat="all">Anasayfa</button><button data-cat="gundem">Gündem</button><button data-cat="personel_alimi">Personel Alımı</button><button data-cat="akademik_personel">Akademik Personel</button><button data-cat="sinav">Sınav</button><button data-cat="tayin">Tayin</button><button data-cat="kamu_personeli">Kamu Personeli</button><button data-cat="egitim_burs">Eğitim-Burs</button><button data-cat="sivil_toplum">Sivil Toplum</button><button data-cat="destekler">Destekler</button></nav></div><div class="bg-[#243fb5] text-white h-10 flex items-center overflow-hidden"><div class="bg-[#213996] px-4 h-full flex items-center font-black text-sm shrink-0 skew-x-[-18deg]"><span class="skew-x-[18deg]">• SON DAKİKA</span></div><div class="overflow-hidden flex-1"><div id="ticker" class="ticker text-yellow-300 font-black text-sm whitespace-nowrap">Yükleniyor...</div></div></div></header><main class="max-w-6xl mx-auto px-4 py-6"><section id="searchBox" class="hidden mb-5"><input id="q" class="w-full border-2 border-blue-700 rounded-2xl px-5 py-4 font-bold" placeholder="Haber, kurum, kadro veya özet ara..."></section><section class="ad rounded-2xl border border-slate-200 p-5 text-center text-slate-500 text-sm mb-6"><b>Reklam Alanı</b> — kullanıcıyı yormayan yatay sponsor alanı</section><section class="grid lg:grid-cols-12 gap-6"><div class="lg:col-span-8"><div class="flex items-center justify-between mb-4"><h1 class="text-2xl font-black">Güncel Duyurular</h1><span id="count" class="text-sm font-bold text-slate-500"></span></div><div id="grid" class="grid md:grid-cols-2 gap-5"></div></div><aside class="lg:col-span-4 space-y-5"><div class="ad rounded-2xl border border-slate-200 p-6 text-center text-slate-500 text-sm"><b>Reklam Alanı</b><br>300x250 sponsor kutusu</div><div class="bg-slate-50 rounded-2xl border p-5"><h2 class="font-black mb-3">Kategoriler</h2><div id="sideCats" class="grid grid-cols-2 gap-2 text-sm"></div></div><div class="ad rounded-2xl border border-slate-200 p-6 text-center text-slate-500 text-sm"><b>Reklam Alanı</b><br>Yerel / STK sponsorluğu</div></aside></section></main><footer class="border-t mt-8 py-8 text-center text-sm text-slate-500">© <span id="year"></span> haber.sivildunya.com · <a href="/rss.xml" class="font-bold text-blue-700">RSS</a></footer><script>const labels={gundem:'Gündem',personel_alimi:'Personel Alımı',akademik_personel:'Akademik Personel',sinav:'Sınav',tayin:'Tayin',kamu_personeli:'Kamu Personeli',egitim_burs:'Eğitim-Burs',sivil_toplum:'Sivil Toplum',destekler:'Destekler',kamusal_duyurular:'Gündem',kamu_personeli_alimleri:'Personel Alımı',dernek_ve_stk_gelismeleri:'Sivil Toplum'};let items=[],cat='all',query='';year.textContent=new Date().getFullYear();function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(data){let out=[]; if(data.kategoriler){Object.entries(data.kategoriler).forEach(([k,arr])=>(arr||[]).forEach((x,i)=>out.push({id:`${k}-${i}`,category:k,title:x.baslik||x.kurum||'Duyuru',summary:x.ozet||[x.kadro,x.basvuru_tarihleri,x.mecra].filter(Boolean).join(' · '),kurum:x.kurum,kadro:x.kadro,basvuru_tarihleri:x.basvuru_tarihleri,mecra:x.mecra,date:data.tarih,source_url:x.source_url||'#'})))} else if(Array.isArray(data)){out=data.map(x=>({category:x.category,title:x.title,summary:x.summary||x.description,date:x.date,source_url:x.source_url||x.url||'#',...x}))} return out}function filt(){return items.filter(x=>(cat==='all'||x.category===cat||labels[x.category]===labels[cat])&&(!query||JSON.stringify(x).toLowerCase().includes(query)))}function card(x){let blue='bg-blue-700', title=esc(x.title||x.baslik||x.kurum); return `<article class="rounded-2xl border border-slate-200 bg-white shadow-sm hover:shadow-lg transition overflow-hidden"><div class="h-1 ${blue}"></div><div class="p-5"><span class="inline-block bg-blue-50 text-blue-700 rounded-full px-3 py-1 text-xs font-black mb-3">${esc(labels[x.category]||x.category)}</span><h2 class="font-black text-lg leading-tight mb-3">${title}</h2>${x.kurum?`<div class="text-sm space-y-1 mb-3"><p><b>Kurum:</b> ${esc(x.kurum)}</p><p><b>Kadro:</b> ${esc(x.kadro)}</p><p><b>Başvuru:</b> ${esc(x.basvuru_tarihleri)}</p><p><b>Mecra:</b> ${esc(x.mecra)}</p></div>`:`<p class="text-slate-600 text-sm leading-6 mb-4">${esc(x.summary)}</p>`}<div class="flex items-center justify-between pt-4 border-t"><time class="text-xs font-bold text-slate-400">${esc(x.date||'')}</time><a class="bg-slate-900 text-white rounded-xl px-3 py-2 text-xs font-black" href="${esc(x.source_url||'#')}" target="_blank" rel="noopener noreferrer">Kaynağa Git</a></div></div></article>`}function render(){let f=filt();count.textContent=f.length+' kayıt';grid.innerHTML=f.map(card).join('')||'<div class="p-8 border rounded-2xl">Sonuç bulunamadı.</div>';ticker.textContent=(items[0]?.title||items[0]?.baslik||'Sivil Dünya Haberler güncel bülteni')+'  •  '+(items[1]?.title||items[1]?.baslik||'Kamu ve STK duyuruları');sideCats.innerHTML=Object.entries(labels).slice(0,9).map(([k,v])=>`<button data-cat="${k}" class="side text-left bg-white border rounded-xl px-3 py-2 font-bold hover:bg-blue-50">${v}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()})}async function load(){let r=await fetch('/data/duyurular.json?ts='+Date.now());items=norm(await r.json());render()}q?.addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});searchToggle.onclick=()=>searchBox.classList.toggle('hidden');themeBtn.onclick=()=>document.documentElement.classList.toggle('dark');load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw
